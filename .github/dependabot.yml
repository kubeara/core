version: 2
updates:
  # Root monorepo dependencies (NestJS, TypeORM, etc.)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "bhushan-kubeara"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  # SPA dependencies
  - package-ecosystem: "npm"
    directory: "/console-app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "bhushan-kubeara"
    labels:
      - "dependencies"
      - "console-app"
    commit-message:
      prefix: "chore"
      include: "scope"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - "bhushan-kubeara"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
