name: CI/CD

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:ci

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build apps
        run: npm run build:apps

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run template tests
        run: npm run test:templates -- --ci --passWithNoTests

  publish-docker:
    name: Push Docker images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Prefer repo variable DOCKERHUB_USERNAME (visible in logs). Token must stay in secrets.
    env:
      DOCKER_HUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: control-panel-app
            dockerfile: apps/control-panel-app/Dockerfile
            image: control-panel-app
          - name: agent-app
            dockerfile: apps/agent-app/Dockerfile
            image: agent-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Show Docker Hub target
        run: |
          if [ -z "${DOCKER_HUB_USERNAME}" ]; then
            echo "::error::DOCKERHUB_USERNAME is not set. Add it as a repository secret or variable (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          if [ -n "${{ vars.DOCKERHUB_USERNAME }}" ]; then
            echo "DOCKERHUB_USERNAME source: repository variable (visible)"
          else
            echo "DOCKERHUB_USERNAME source: repository secret (username may be masked below)"
          fi
          echo "Docker Hub namespace: ${DOCKER_HUB_USERNAME}"
          echo "Will push:"
          echo "  ${DOCKER_HUB_USERNAME}/${{ matrix.image }}:latest"
          echo "  ${DOCKER_HUB_USERNAME}/${{ matrix.image }}:${{ github.sha }}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify Docker Hub login
        run: |
          CONFIG="${HOME}/.docker/config.json"
          if [ -f "$CONFIG" ]; then
            HUB_USER=$(jq -r '
              .auths["https://index.docker.io/v1/"].username //
              (.auths | to_entries[] | select(.key | test("docker.io")) | .value.username) //
              empty
            ' "$CONFIG" 2>/dev/null | head -n1)
            if [ -n "$HUB_USER" ]; then
              echo "Docker CLI logged in as: ${HUB_USER}"
              if [ "$HUB_USER" != "${DOCKER_HUB_USERNAME}" ]; then
                echo "::warning::CLI username (${HUB_USER}) differs from configured namespace (${DOCKER_HUB_USERNAME})"
              fi
            fi
          fi

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.DOCKER_HUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ env.DOCKER_HUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Confirm image on Docker Hub
        run: |
          docker buildx imagetools inspect "${DOCKER_HUB_USERNAME}/${{ matrix.image }}:latest"
          echo "Published: https://hub.docker.com/r/${DOCKER_HUB_USERNAME}/${{ matrix.image }}"
