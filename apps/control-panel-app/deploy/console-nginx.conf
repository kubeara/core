# Console (SPA) served by nginx, with /api and /socket.io proxied to the control
# panel so the SPA and API share one origin. Same-origin avoids cross-site
# SameSite cookie blocking and CORS entirely, regardless of the host the user
# browses from (localhost, 127.0.0.1, LAN IP, hostname).
#
# The upstream targets the control panel compose service by container name on
# the compose network; the port must match the panel's PORT (default 3410).
# install.sh regenerates this file with the actual PORT from .env.control-panel.
resolver 127.0.0.11 valid=10s;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  set $control_panel_upstream http://kubeara-control-panel:3410;

  location = /env.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass $control_panel_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass $control_panel_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~* \.(?:css|js|mjs|map|ico|png|jpg|jpeg|gif|svg|webp|woff|woff2)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
