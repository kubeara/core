# documentation: https://docs.continue.dev/guides/how-to-self-host-a-model
# shortDescription: Ollama backend for the Continue IDE extension
# longDescription: <p>Continue is an IDE extension; this template deploys <strong>Ollama</strong> as the recommended local backend.</p><p>Point Continue at <code>${SERVICE_URL_CONTINUE_DEV}</code> with provider <code>ollama</code>. On first deploy, a one-shot init job pulls <code>llama3.2</code>.</p>
# category: ai,development
# tags: continue,continue-dev,ai,coding,ollama,llm,ide
# port: 11434

services:
  continue-dev:
    image: ${CONTINUE_DEV_OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: ${CONTINUE_DEV_RESTART_POLICY:-unless-stopped}

    ports:
      - '${SERVICE_PORT_CONTINUE_DEV:-11434}:11434'

    environment:
      - SERVICE_URL_CONTINUE_DEV_11434
      - OLLAMA_HOST=${CONTINUE_DEV_OLLAMA_HOST:-0.0.0.0:11434}
      - TZ=${TZ:-UTC}

    volumes:
      - continue_dev_data:/root/.ollama

    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  continue-dev-model-init:
    image: ${CONTINUE_DEV_OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: ${CONTINUE_DEV_MODEL_INIT_RESTART_POLICY:-no}

    depends_on:
      continue-dev:
        condition: service_healthy

    network_mode: service:continue-dev

    environment:
      - OLLAMA_HOST=127.0.0.1:11434
      - OLLAMA_MODEL=${CONTINUE_DEV_OLLAMA_MODEL:-llama3.2}
      - TZ=${TZ:-UTC}

    volumes:
      - continue_dev_data:/root/.ollama

    command: ['pull', '${CONTINUE_DEV_OLLAMA_MODEL:-llama3.2}']

    healthcheck:
      test: ['CMD-SHELL', 'exit 0']
      interval: 5s
      timeout: 3s
      retries: 1
      start_period: 5s

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  continue_dev_data:
