# documentation: https://umami.is/docs
# shortDescription: Privacy-focused website analytics
# longDescription: <p>Umami is a simple, fast, and <strong>privacy-focused</strong> alternative to Google Analytics.</p><p>Includes PostgreSQL. Default login after first start: <code>admin</code> / <code>umami</code> — change the password immediately.</p>
# category: analytics,monitoring
# tags: umami,analytics,privacy,web,statistics,postgresql
# logo: svgs/umami.svg
# port: 3000

services:
  umami:
    image: ${UMAMI_IMAGE:-ghcr.io/umami-software/umami:postgresql-latest}
    restart: ${UMAMI_RESTART_POLICY:-unless-stopped}

    ports:
      - '${SERVICE_PORT_UMAMI:-3000}:3000'

    environment:
      - SERVICE_URL_UMAMI_3000
      - DATABASE_URL=postgresql://${SERVICE_USER_UMAMI}:${SERVICE_PASSWORD_UMAMI}@postgres:5432/${UMAMI_DB_NAME:-umami}
      - APP_SECRET=${SERVICE_HEX_64_UMAMI}
      - DISABLE_TELEMETRY=${UMAMI_DISABLE_TELEMETRY:-1}
      - TZ=${TZ:-UTC}

    init: true

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:3000/api/heartbeat || exit 1']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: ${UMAMI_POSTGRES_IMAGE:-postgres:16-alpine}
    restart: ${UMAMI_POSTGRES_RESTART_POLICY:-unless-stopped}

    environment:
      POSTGRES_USER: ${SERVICE_USER_UMAMI}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_UMAMI}
      POSTGRES_DB: ${UMAMI_DB_NAME:-umami}
      TZ: ${TZ:-UTC}

    volumes:
      - umami_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  umami_postgres_data:
