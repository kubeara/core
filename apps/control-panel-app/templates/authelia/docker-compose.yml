# documentation: https://www.authelia.com/integration/deployment/docker/
# shortDescription: Single sign-on and multi-factor authentication portal
# longDescription: <p>Authelia is a lightweight <strong>authentication server</strong> for protecting web applications with SSO, 2FA, and access control.</p><p>Includes Redis with file-based users and local SQLite storage. Default user <code>authelia</code> password is <code>authelia</code> — change after deploy. Secrets use <code>SERVICE_HEX_64_AUTHELIA</code>, <code>SERVICE_HEX_128_AUTHELIA</code>, and <code>SERVICE_HEX_32_AUTHELIA</code>.</p>
# category: security,auth,iam
# tags: authelia,sso,2fa,mfa,authentication,forward-auth,security
# logo: svgs/authelia.svg
# port: 9091

configs:
  authelia_configuration:
    content: |
      ---
      server:
        address: 'tcp://:9091'
      log:
        level: 'info'
      authentication_backend:
        file:
          path: '/config/users_database.yml'
      access_control:
        default_policy: 'deny'
        rules:
          - domain: 'localhost'
            policy: 'bypass'
      session:
        secret: 'insecure_session_secret'
        cookies:
          - domain: 'localhost'
            authelia_url: 'http://localhost:9091'
        redis:
          host: 'redis'
          port: 6379
      storage:
        encryption_key: 'insecure_storage_encryption_key'
        local:
          path: '/config/db.sqlite3'
      notifier:
        filesystem:
          filename: '/config/notifications.txt'
  authelia_users_database:
    content: |
      ---
      users:
        authelia:
          disabled: false
          displayname: 'Authelia User'
          password: '$$argon2id$$v=19$$m=65536,t=3,p=4$$qOKNq+u5lZHOTnsJY1Sp3g$$s6zT9EKncfkmIJmykzZProUigRRJ26hlTl1WC+mG2do'
          email: 'authelia@example.com'
          groups:
            - 'admins'

services:
  authelia:
    image: ${AUTHELIA_IMAGE:-authelia/authelia:4.39.16}
    restart: ${AUTHELIA_RESTART_POLICY:-unless-stopped}

    ports:
      - '${SERVICE_PORT_AUTHELIA:-9091}:9091'

    environment:
      - SERVICE_URL_AUTHELIA_9091
      - AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET=${SERVICE_HEX_64_AUTHELIA}
      - AUTHELIA_SESSION_SECRET=${SERVICE_HEX_128_AUTHELIA}
      - AUTHELIA_STORAGE_ENCRYPTION_KEY=${SERVICE_HEX_32_AUTHELIA}
      - AUTHELIA_SESSION_COOKIES_0_DOMAIN=${SERVICE_FQDN_AUTHELIA:-${SERVICE_FQDN_AUTHELIA_9091:-localhost}}
      - AUTHELIA_SESSION_COOKIES_0_AUTHELIA_URL=${SERVICE_URL_AUTHELIA:-${SERVICE_URL_AUTHELIA_9091}}
      - TZ=${TZ:-UTC}

    volumes:
      - authelia_config:/config

    configs:
      - source: authelia_configuration
        target: /config/configuration.yml
      - source: authelia_users_database
        target: /config/users_database.yml

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9091/api/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: ${AUTHELIA_REDIS_IMAGE:-redis:7.4-alpine}
    restart: ${AUTHELIA_REDIS_RESTART_POLICY:-unless-stopped}

    volumes:
      - authelia_redis_data:/data

    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep PONG']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  authelia_config:
  authelia_redis_data:
