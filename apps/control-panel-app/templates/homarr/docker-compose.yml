# documentation: https://homarr.dev/docs
# shortDescription: Modern customizable dashboard for your homelab services
# longDescription: <p>Homarr is a modern <strong>self-hosted dashboard</strong> to organize and launch your services.</p><p>Customize pages, add integrations, and centralize links to your internal apps.</p>
# category: self-hosted-dashboards
# tags: homarr,dashboard,homelab,startpage,launcher
# port: 7575

services:
  homarr:
    image: ${HOMARR_IMAGE:-ghcr.io/homarr-labs/homarr:latest}
    restart: ${HOMARR_RESTART_POLICY:-unless-stopped}

    ports:
      - '${SERVICE_PORT_HOMARR:-7575}:7575'

    environment:
      - SERVICE_URL_HOMARR_7575
      - SECRET_ENCRYPTION_KEY=${HOMARR_SECRET_ENCRYPTION_KEY:-31ba05520db9d1dc463c66d81c3195db8c4b5010e97c352c11377877ef1a8d50}
      - TZ=${TZ:-UTC}

    volumes:
      - homarr_data:/appdata

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7575 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  homarr_data:
