# documentation: https://pocketbase.io/docs/
# shortDescription: Open-source backend in a single executable
# longDescription: <p>PocketBase is an open-source <strong>backend-as-a-service</strong> with realtime database, auth, and file storage in one container.</p><p>Create the admin account at <code>/_/</code> on first launch.</p>
# category: backend,api,database
# tags: pocketbase,backend,baas,sqlite,api,realtime
# port: 8090

services:
  pocketbase:
    image: ${POCKETBASE_IMAGE:-ghcr.io/muchobien/pocketbase:latest}
    restart: ${POCKETBASE_RESTART_POLICY:-unless-stopped}

    ports:
      - '${SERVICE_PORT_POCKETBASE:-8090}:8090'

    environment:
      - SERVICE_URL_POCKETBASE_8090

    volumes:
      - pocketbase_data:/pb_data

    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8090/api/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pocketbase_data:
