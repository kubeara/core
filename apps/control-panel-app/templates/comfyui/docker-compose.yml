
# documentation: https://github.com/mmartial/ComfyUI-Nvidia-Docker
# shortDescription: Node-based workflow UI for Stable Diffusion image generation
# longDescription: <p>ComfyUI is a <strong>graph-based workflow UI</strong> for Stable Diffusion with powerful customization.</p><p>Requires an NVIDIA GPU for practical use. Models, inputs, and outputs persist in named volumes.</p>
# category: ai,image
# tags: comfyui,stable-diffusion,image-generation,ai,workflow,gpu
# port: 8188

services:
  comfyui:
    image: ${COMFYUI_IMAGE:-mmartial/comfyui-nvidia-docker:ubuntu22_cuda12.2.2-latest}
    restart: ${COMFYUI_RESTART_POLICY:-unless-stopped}

    ports:
      - '${SERVICE_PORT_COMFYUI:-8188}:8188'

    environment:
      - SERVICE_URL_COMFYUI_8188
      - USE_UV=${COMFYUI_USE_UV:-true}
      - WANTED_UID=${COMFYUI_WANTED_UID:-1000}
      - WANTED_GID=${COMFYUI_WANTED_GID:-1000}
      - BASE_DIRECTORY=/basedir
      - SECURITY_LEVEL=${COMFYUI_SECURITY_LEVEL:-normal}
      - NVIDIA_VISIBLE_DEVICES=${COMFYUI_NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=${COMFYUI_NVIDIA_DRIVER_CAPABILITIES:-all}
      - TZ=${TZ:-UTC}

    volumes:
      - comfyui_run:/comfy/mnt
      - comfyui_basedir:/basedir

    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8188/ || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  comfyui_run:
  comfyui_basedir:
