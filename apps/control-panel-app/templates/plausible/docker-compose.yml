# documentation: https://github.com/plausible/community-edition
# shortDescription: Privacy-friendly web analytics
# longDescription: <p>Plausible is a lightweight, <strong>privacy-focused analytics</strong> alternative to Google Analytics.</p><p>Includes PostgreSQL and ClickHouse. Set <code>BASE_URL</code> via <code>SERVICE_URL_PLAUSIBLE</code> for accurate links and webhooks. Register your account on first launch.</p>
# category: analytics,monitoring
# tags: plausible,analytics,privacy,web,statistics,clickhouse
# logo: svgs/plausible.svg
# port: 8000

configs:
  plausible_clickhouse_ipv4:
    content: |
      <clickhouse>
          <listen_host>0.0.0.0</listen_host>
      </clickhouse>
  plausible_clickhouse_low_resources:
    content: |
      <clickhouse>
          <max_server_memory_usage_to_ram_ratio>0.4</max_server_memory_usage_to_ram_ratio>
          <max_server_memory_usage>524288000</max_server_memory_usage>
      </clickhouse>

services:
  plausible:
    image: ${PLAUSIBLE_IMAGE:-ghcr.io/plausible/community-edition:v3.2.0}
    restart: ${PLAUSIBLE_RESTART_POLICY:-unless-stopped}

    ports:
      - '${SERVICE_PORT_PLAUSIBLE:-8000}:8000'

    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"

    environment:
      - SERVICE_URL_PLAUSIBLE_8000
      - TMPDIR=/var/lib/plausible/tmp
      - BASE_URL=${SERVICE_URL_PLAUSIBLE:-${SERVICE_URL_PLAUSIBLE_8000}}
      - SECRET_KEY_BASE=${SERVICE_BASE64_64_PLAUSIBLE}
      - TOTP_VAULT_KEY=${SERVICE_HEX_32_PLAUSIBLE}
      - HTTP_PORT=8000
      - DISABLE_REGISTRATION=${PLAUSIBLE_DISABLE_REGISTRATION:-invite_only}
      - DATABASE_URL=postgres://${SERVICE_USER_PLAUSIBLE}:${SERVICE_PASSWORD_PLAUSIBLE}@postgres:5432/${PLAUSIBLE_DB_NAME:-plausible_db}
      - CLICKHOUSE_DATABASE_URL=http://clickhouse:8123/${PLAUSIBLE_CLICKHOUSE_DB:-plausible_events_db}
      - TZ=${TZ:-UTC}

    volumes:
      - plausible_data:/var/lib/plausible

    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8000/api/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: ${PLAUSIBLE_POSTGRES_IMAGE:-postgres:16-alpine}
    restart: ${PLAUSIBLE_POSTGRES_RESTART_POLICY:-unless-stopped}

    environment:
      POSTGRES_USER: ${SERVICE_USER_PLAUSIBLE}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_PLAUSIBLE}
      POSTGRES_DB: ${PLAUSIBLE_DB_NAME:-plausible_db}
      TZ: ${TZ:-UTC}

    volumes:
      - plausible_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  clickhouse:
    image: ${PLAUSIBLE_CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:24.12-alpine}
    restart: ${PLAUSIBLE_CLICKHOUSE_RESTART_POLICY:-unless-stopped}

    environment:
      CLICKHOUSE_SKIP_USER_SETUP: 1
      TZ: ${TZ:-UTC}

    configs:
      - source: plausible_clickhouse_ipv4
        target: /etc/clickhouse-server/config.d/ipv4-only.xml
      - source: plausible_clickhouse_low_resources
        target: /etc/clickhouse-server/config.d/low-resources.xml

    volumes:
      - plausible_clickhouse_data:/var/lib/clickhouse
      - plausible_clickhouse_logs:/var/log/clickhouse-server

    ulimits:
      nofile:
        soft: 262144
        hard: 262144

    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8123/ping || exit 1']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 512M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  plausible_data:
  plausible_postgres_data:
  plausible_clickhouse_data:
  plausible_clickhouse_logs:
