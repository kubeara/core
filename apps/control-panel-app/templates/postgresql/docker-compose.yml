services:
  postgres:
    image: ${POSTGRES_IMAGE}
    restart: ${POSTGRES_RESTART_POLICY}

    ports:
      - '${POSTGRES_PORT}:5432'

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: ${POSTGRES_DATA_PATH}
      TZ: ${TZ}
      PGTZ: ${PGTZ}

    volumes:
      - postgres_data:${POSTGRES_DATA_PATH}

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}'
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
