# documentation: https://www.postgresql.org
# shortDescription: Advanced open source relational database
# longDescription: <p>PostgreSQL is a powerful, open source <strong>object-relational database</strong> system with over 35 years of active development.</p><p>Use it for transactional apps, analytics, and geospatial workloads.</p>
# category: database,postgresql,sql
# tags: postgres,postgresql,database,sql
# logo: svgs/postgresql-logo-svgrepo-com.svg
# port: 5432

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    restart: ${POSTGRES_RESTART_POLICY:-unless-stopped}

    ports:
      - '${SERVICE_PORT_POSTGRES}:5432'

    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      PGDATA: ${POSTGRES_DATA_PATH:-/var/lib/postgresql/data}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
