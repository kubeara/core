# documentation: https://appwrite.io/docs/advanced/self-hosting/installation
# shortDescription: Open-source backend-as-a-service platform
# longDescription: <p>Appwrite is an open-source <strong>BaaS</strong> for authentication, databases, storage, and serverless functions.</p><p>Full stack with Traefik, MariaDB, Redis, workers, and executor. Set <code>_APP_DOMAIN</code> via <code>SERVICE_FQDN_APPWRITE</code>. Create your admin account on first launch.</p>
# category: backend,baas,api
# tags: appwrite,baas,backend,auth,database,storage,functions,api
# logo: svgs/appwrite.svg
# port: 80

services:

  traefik:
    image: ${APPWRITE_TRAEFIK_IMAGE:-traefik:2.11}
    restart: ${APPWRITE_TRAEFIK_RESTART_POLICY:-unless-stopped}

    ports:
      - '${SERVICE_PORT_APPWRITE:-80}:80'

    environment:
      - SERVICE_URL_APPWRITE_80

    command:
      - --providers.file.directory=/storage/config
      - --providers.file.watch=true
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.constraints=Label(`traefik.constraint-label-stack`,`appwrite`)
      - --entrypoints.appwrite_web.address=:80

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - appwrite_config:/storage/config:ro
      - appwrite_certificates:/storage/certificates:ro

    depends_on:
      appwrite:
        condition: service_healthy

    networks:
      - gateway
      - appwrite

    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:80 || exit 1']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  appwrite:
    image: ${APPWRITE_IMAGE:-appwrite/appwrite:1.6.1}
    restart: ${APPWRITE_RESTART_POLICY:-unless-stopped}

    networks:
      - appwrite

    labels:
      - traefik.enable=true
      - traefik.constraint-label-stack=appwrite
      - traefik.docker.network=appwrite
      - traefik.http.services.appwrite_api.loadbalancer.server.port=80
      - traefik.http.routers.appwrite_api_http.entrypoints=appwrite_web
      - traefik.http.routers.appwrite_api_http.rule=PathPrefix(`/`)
      - traefik.http.routers.appwrite_api_http.service=appwrite_api

    volumes:
      - appwrite_uploads:/storage/uploads
      - appwrite_cache:/storage/cache
      - appwrite_config:/storage/config
      - appwrite_certificates:/storage/certificates
      - appwrite_functions:/storage/functions

    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      _APP_ENV: production
      _APP_LOCALE: en
      _APP_OPENSSL_KEY_V1: ${SERVICE_HEX_128_APPWRITE}
      _APP_DOMAIN: ${SERVICE_FQDN_APPWRITE:-${SERVICE_FQDN_APPWRITE_80:-localhost}}
      _APP_DOMAIN_TARGET: ${SERVICE_FQDN_APPWRITE:-${SERVICE_FQDN_APPWRITE_80:-localhost}}
      _APP_DOMAIN_FUNCTIONS: ${APPWRITE_DOMAIN_FUNCTIONS:-functions.localhost}
      _APP_OPTIONS_ABUSE: disabled
      _APP_OPTIONS_ROUTER_PROTECTION: disabled
      _APP_OPTIONS_FORCE_HTTPS: disabled
      _APP_OPTIONS_FUNCTIONS_FORCE_HTTPS: disabled
      _APP_USAGE_STATS: disabled
      _APP_DB_HOST: mariadb
      _APP_DB_PORT: 3306
      _APP_DB_SCHEMA: ${APPWRITE_DB_NAME:-appwrite}
      _APP_DB_USER: ${SERVICE_USER_APPWRITE}
      _APP_DB_PASS: ${SERVICE_PASSWORD_APPWRITE}
      _APP_REDIS_HOST: redis
      _APP_REDIS_PORT: 6379
      _APP_REDIS_USER: ${APPWRITE_REDIS_USER:-unused}
      _APP_REDIS_PASS: ${SERVICE_HEX_32_APPWRITE}
      _APP_STORAGE_DEVICE: local
      _APP_STORAGE_LIMIT: 30000000
      _APP_FUNCTIONS_SIZE_LIMIT: 30000000
      _APP_FUNCTIONS_TIMEOUT: 900
      _APP_FUNCTIONS_BUILD_TIMEOUT: 900
      _APP_FUNCTIONS_CPUS: 1
      _APP_FUNCTIONS_MEMORY: 2048
      _APP_FUNCTIONS_RUNTIMES: node-18.0,php-8.0,python-3.9,ruby-3.0
      _APP_EXECUTOR_SECRET: ${SERVICE_PASSWORDWITHSYMBOLS_64_APPWRITE}
      _APP_EXECUTOR_HOST: http://openruntimes-executor/v1
      _APP_SYSTEM_EMAIL_NAME: Appwrite
      _APP_SYSTEM_EMAIL_ADDRESS: ${APPWRITE_SYSTEM_EMAIL:-team@example.com}
      _APP_SYSTEM_SECURITY_EMAIL_ADDRESS: ${APPWRITE_SECURITY_EMAIL:-security@example.com}
      _APP_SMTP_HOST: ${APPWRITE_SMTP_HOST:-localhost}
      _APP_SMTP_PORT: ${APPWRITE_SMTP_PORT:-25}
      _APP_SMTP_SECURE: ${APPWRITE_SMTP_SECURE:-none}
      _APP_SMTP_USERNAME: ${APPWRITE_SMTP_USERNAME:-unused}
      _APP_SMTP_PASSWORD: ${APPWRITE_SMTP_PASSWORD:-unused}
      TZ: ${TZ:-UTC}


    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1/v1/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

