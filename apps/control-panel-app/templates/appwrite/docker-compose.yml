      MYSQL_DATABASE: ${APPWRITE_DB_NAME:-appwrite}
      MYSQL_USER: ${SERVICE_USER_APPWRITE}
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_APPWRITE}
      TZ: ${TZ:-UTC}

    command: mysqld --innodb-flush-method=fsync

    volumes:
      - appwrite_mariadb_data:/var/lib/mysql

    healthcheck:
      test: ['CMD-SHELL', 'healthcheck.sh --connect --innodb_initialized']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
