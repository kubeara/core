    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --maxmemory-samples 5 --requirepass ${SERVICE_HEX_32_APPWRITE}

    volumes:
      - appwrite_redis_data:/data

    environment:
      REDIS_PASSWORD: ${SERVICE_HEX_32_APPWRITE}
      TZ: ${TZ:-UTC}

    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

