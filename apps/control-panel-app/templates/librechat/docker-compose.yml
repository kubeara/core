# documentation: https://docs.librechat.ai/install/configuration/dotenv.html
# shortDescription: Self-hosted multi-model AI chat UI
# longDescription: <p>LibreChat is a <strong>privacy-focused chat UI</strong> for OpenAI, Anthropic, Google, Azure, Ollama, and more.</p><p>Includes MongoDB, Meilisearch, pgvector, and RAG API. Secrets use <code>SERVICE_PASSWORD_JWT</code>, <code>SERVICE_PASSWORD_MEILI</code>, and related <code>SERVICE_*</code> keys. Set provider API keys after deploy.</p>
# category: ai,llm
# tags: librechat,ai,chat,gpt,claude,openai,anthropic,ollama,llm,rag
# logo: svgs/librechat.svg
# port: 3080

services:
  librechat:
    image: ${LIBRECHAT_IMAGE:-ghcr.io/danny-avila/librechat-dev-api:latest}
    restart: ${LIBRECHAT_RESTART_POLICY:-unless-stopped}

    ports:
      - '${SERVICE_PORT_LIBRECHAT:-3080}:3080'

    environment:
      - SERVICE_URL_LIBRECHAT_3080
      - DOMAIN_CLIENT=${SERVICE_URL_LIBRECHAT:-${SERVICE_URL_LIBRECHAT_3080}}
      - DOMAIN_SERVER=${SERVICE_URL_LIBRECHAT:-${SERVICE_URL_LIBRECHAT_3080}}
      - HOST=0.0.0.0
      - PORT=3080
      - MONGO_URI=mongodb://${SERVICE_USER_MONGO}:${SERVICE_PASSWORD_MONGO}@mongodb:27017/librechat?authSource=admin
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY=${SERVICE_PASSWORD_MEILI}
      - RAG_PORT=8000
      - RAG_API_URL=http://rag-api:8000
      - JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - JWT_REFRESH_SECRET=${SERVICE_PASSWORD_64_JWT}
      - APP_TITLE=${LIBRECHAT_APP_TITLE:-LibreChat}
      - ALLOW_EMAIL_LOGIN=${LIBRECHAT_ALLOW_EMAIL_LOGIN:-true}
      - ALLOW_REGISTRATION=${LIBRECHAT_ALLOW_REGISTRATION:-true}
      - ALLOW_SOCIAL_LOGIN=${LIBRECHAT_ALLOW_SOCIAL_LOGIN:-false}
      - ALLOW_SOCIAL_REGISTRATION=${LIBRECHAT_ALLOW_SOCIAL_REGISTRATION:-false}
      - ALLOW_PASSWORD_RESET=${LIBRECHAT_ALLOW_PASSWORD_RESET:-false}
      - ALLOW_UNVERIFIED_EMAIL_LOGIN=${LIBRECHAT_ALLOW_UNVERIFIED_EMAIL_LOGIN:-true}
      - CREDS_KEY=${SERVICE_PASSWORD_64_CREDS}
      - CREDS_IV=${SERVICE_PASSWORD_CREDS}
      - ANTHROPIC_API_KEY=${LIBRECHAT_ANTHROPIC_API_KEY:-user_provided}
      - GOOGLE_KEY=${LIBRECHAT_GOOGLE_API_KEY:-user_provided}
      - OPENAI_API_KEY=${LIBRECHAT_OPENAI_API_KEY:-user_provided}
      - ASSISTANTS_API_KEY=${LIBRECHAT_ASSISTANTS_API_KEY:-user_provided}
      - DEBUG_LOGGING=${LIBRECHAT_DEBUG_LOGGING:-false}
      - DEBUG_OPENAI=${LIBRECHAT_DEBUG_OPENAI:-false}
      - DEBUG_PLUGINS=${LIBRECHAT_DEBUG_PLUGINS:-false}
      - NO_INDEX=${LIBRECHAT_NO_INDEX:-true}
      - TZ=${TZ:-UTC}

    extra_hosts:
      - host.docker.internal:host-gateway

    volumes:
      - librechat_images:/app/client/public/images
      - librechat_logs:/app/api/logs
      - librechat_uploads:/app/uploads

    depends_on:
      mongodb:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      vectordb:
        condition: service_healthy
      rag-api:
        condition: service_healthy

    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:3080/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mongodb:
    image: ${LIBRECHAT_MONGODB_IMAGE:-mongo:8}
    restart: ${LIBRECHAT_MONGODB_RESTART_POLICY:-unless-stopped}

    environment:
      - MONGO_INITDB_ROOT_USERNAME=${SERVICE_USER_MONGO}
      - MONGO_INITDB_ROOT_PASSWORD=${SERVICE_PASSWORD_MONGO}
      - TZ=${TZ:-UTC}

    volumes:
      - librechat_mongodb_data:/data/db

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand(''ping'')" || exit 1',
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  meilisearch:
    image: ${LIBRECHAT_MEILISEARCH_IMAGE:-getmeili/meilisearch:v1.35.1}
    restart: ${LIBRECHAT_MEILISEARCH_RESTART_POLICY:-unless-stopped}

    environment:
      - MEILI_MASTER_KEY=${SERVICE_PASSWORD_MEILI}
      - MEILI_NO_ANALYTICS=${LIBRECHAT_MEILI_NO_ANALYTICS:-true}
      - MEILI_ENV=production
      - TZ=${TZ:-UTC}

    volumes:
      - librechat_meilisearch_data:/meili_data

    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:7700/health || exit 1']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  vectordb:
    image: ${LIBRECHAT_VECTORDB_IMAGE:-pgvector/pgvector:0.8.0-pg15-trixie}
    restart: ${LIBRECHAT_VECTORDB_RESTART_POLICY:-unless-stopped}

    environment:
      - POSTGRES_DB=${LIBRECHAT_VECTORDB_DB:-rag}
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - TZ=${TZ:-UTC}

    volumes:
      - librechat_vectordb_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${SERVICE_USER_POSTGRES} -d ${LIBRECHAT_VECTORDB_DB:-rag}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rag-api:
    image: ${LIBRECHAT_RAG_API_IMAGE:-ghcr.io/danny-avila/librechat-rag-api-dev-lite:v0.7.3}
    restart: ${LIBRECHAT_RAG_API_RESTART_POLICY:-unless-stopped}

    environment:
      - POSTGRES_DB=${LIBRECHAT_VECTORDB_DB:-rag}
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - DB_HOST=vectordb
      - DB_USER=${SERVICE_USER_POSTGRES}
      - DB_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - DB_NAME=${LIBRECHAT_VECTORDB_DB:-rag}
      - RAG_PORT=8000
      - RAG_OPENAI_API_KEY=${LIBRECHAT_OPENAI_API_KEY:-user_provided}
      - TZ=${TZ:-UTC}

    depends_on:
      vectordb:
        condition: service_healthy

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/health'')" || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  librechat_images:
  librechat_logs:
  librechat_uploads:
  librechat_mongodb_data:
  librechat_meilisearch_data:
  librechat_vectordb_data:
