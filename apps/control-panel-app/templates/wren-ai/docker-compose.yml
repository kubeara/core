# documentation: https://docs.getwren.ai
# shortDescription: Open-source generative BI engine for text-to-SQL
# longDescription: <p>WrenAI is an open-source <strong>generative BI (GenBI)</strong> engine that turns natural-language questions into governed SQL, dashboards, and charts across 22+ data sources.</p><p>Includes a semantic layer (MDL), vector store, and AI service for text-to-SQL with business context. Requires an <code>OPENAI_API_KEY</code> or compatible LLM provider.</p>
# category: ai,data
# tags: wrenai,bi,text-to-sql,analytics,llm,data,semantic-layer
# logo: svgs/wren-ai.png
# port: 3000

services:
  bootstrap:
    image: ghcr.io/canner/wren-bootstrap:0.1.5
    restart: unless-stopped

    environment:
      DATA_PATH: /app/data
      GENERATION_MODEL: ${GENERATION_MODEL:-gpt-4o-mini}

    volumes:
      - wrenai_data:/app/data
      - wrenai_config:/app/config

    command:
      - /bin/sh
      - -c
      - |
        /bin/sh /app/init.sh
        if [ ! -f /app/config/config.yaml ]; then
          cat > /app/config/config.yaml << YAMLEOF
        type: llm
        provider: litellm_llm
        timeout: 120
        models:
          - alias: default
            model: $${GENERATION_MODEL:-gpt-4o-mini}
            context_window_size: 1000000
            kwargs:
              max_tokens: 4096
              n: 1
              seed: 0
              temperature: 0
        ---
        type: embedder
        provider: litellm_embedder
        models:
          - model: text-embedding-3-large
            alias: default
            timeout: 120
        ---
        type: engine
        provider: wren_ui
        endpoint: http://wren-ui:3000
        ---
        type: engine
        provider: wren_ibis
        endpoint: http://ibis-server:8000
        ---
        type: engine
        provider: wren_engine
        endpoint: http://wren-engine:8080
        ---
        type: document_store
        provider: qdrant
        location: http://qdrant:6333
        embedding_model_dim: 3072
        timeout: 120
        recreate_index: false
        ---
        type: pipeline
        pipes:
          - name: db_schema_indexing
            embedder: litellm_embedder.default
            document_store: qdrant
          - name: historical_question_indexing
            embedder: litellm_embedder.default
            document_store: qdrant
          - name: table_description_indexing
            embedder: litellm_embedder.default
            document_store: qdrant
          - name: db_schema_retrieval
            llm: litellm_llm.default
            embedder: litellm_embedder.default
            document_store: qdrant
          - name: historical_question_retrieval
            embedder: litellm_embedder.default
            document_store: qdrant
          - name: sql_generation
            llm: litellm_llm.default
            engine: wren_ui
            document_store: qdrant
          - name: sql_correction
            llm: litellm_llm.default
            engine: wren_ui
            document_store: qdrant
          - name: followup_sql_generation
            llm: litellm_llm.default
            engine: wren_ui
            document_store: qdrant
          - name: sql_answer
            llm: litellm_llm.default
          - name: semantics_description
            llm: litellm_llm.default
          - name: relationship_recommendation
            llm: litellm_llm.default
          - name: question_recommendation
            llm: litellm_llm.default
          - name: question_recommendation_sql_generation
            llm: litellm_llm.default
            engine: wren_ui
            document_store: qdrant
          - name: chart_generation
            llm: litellm_llm.default
          - name: chart_adjustment
            llm: litellm_llm.default
          - name: intent_classification
            llm: litellm_llm.default
            embedder: litellm_embedder.default
            document_store: qdrant
          - name: misleading_assistance
            llm: litellm_llm.default
          - name: data_assistance
            llm: litellm_llm.default
          - name: sql_pairs_indexing
            document_store: qdrant
            embedder: litellm_embedder.default
          - name: sql_pairs_retrieval
            document_store: qdrant
            embedder: litellm_embedder.default
            llm: litellm_llm.default
          - name: preprocess_sql_data
            llm: litellm_llm.default
          - name: sql_executor
            engine: wren_ui
          - name: user_guide_assistance
            llm: litellm_llm.default
          - name: sql_question_generation
            llm: litellm_llm.default
          - name: sql_generation_reasoning
            llm: litellm_llm.default
          - name: followup_sql_generation_reasoning
            llm: litellm_llm.default
          - name: sql_regeneration
            llm: litellm_llm.default
            engine: wren_ui
          - name: evaluation
            llm: litellm_llm.default
          - name: instructions_indexing
            embedder: litellm_embedder.default
            document_store: qdrant
          - name: instructions_retrieval
            embedder: litellm_embedder.default
            document_store: qdrant
          - name: sql_functions_retrieval
            engine: wren_ibis
            document_store: qdrant
          - name: project_meta_indexing
            document_store: qdrant
          - name: sql_tables_extraction
            llm: litellm_llm.default
          - name: sql_diagnosis
            llm: litellm_llm.default
          - name: sql_knowledge_retrieval
            engine: wren_ibis
            document_store: qdrant
        ---
        settings:
          doc_endpoint: https://docs.getwren.ai
          is_oss: true
          engine_timeout: 30
          column_indexing_batch_size: 50
          table_retrieval_size: 10
          table_column_retrieval_size: 100
          query_cache_maxsize: 1000
          allow_intent_classification: true
          allow_sql_generation_reasoning: true
          allow_sql_functions_retrieval: true
          enable_column_pruning: false
          max_sql_correction_retries: 3
          query_cache_ttl: 3600
          logging_level: INFO
          development: false
          historical_question_retrieval_similarity_threshold: 0.9
          sql_pairs_similarity_threshold: 0.7
          sql_pairs_retrieval_max_size: 10
          instructions_similarity_threshold: 0.7
          instructions_top_k: 10
        YAMLEOF
          echo "config.yaml created"
        else
          echo "config.yaml already exists, skipping"
        fi
        exec sleep infinity

    healthcheck:
      test: ['CMD-SHELL', 'test -f /app/config/config.yaml || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  wren-engine:
    image: ghcr.io/canner/wren-engine:0.22.0
    restart: unless-stopped

    expose:
      - '8080'
      - '7432'

    volumes:
      - wrenai_data:/usr/src/app/etc

    depends_on:
      bootstrap:
        condition: service_healthy

    healthcheck:
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/127.0.0.1/8080" || exit 1']
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ibis-server:
    image: ghcr.io/canner/wren-engine-ibis:0.22.0
    restart: unless-stopped

    expose:
      - '8000'

    environment:
      WREN_ENGINE_ENDPOINT: http://wren-engine:8080

    volumes:
      - wrenai_data:/usr/src/app/data

    depends_on:
      wren-engine:
        condition: service_healthy

    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://127.0.0.1:8000 || exit 1']
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  wren-ai-service:
    image: ghcr.io/canner/wren-ai-service:0.29.3
    restart: unless-stopped

    expose:
      - '5555'

    environment:
      PYTHONUNBUFFERED: 1
      CONFIG_PATH: /app/config/config.yaml
      QDRANT_HOST: qdrant
      WREN_AI_SERVICE_PORT: '5555'

    volumes:
      - wrenai_config:/app/config:ro
      - wrenai_data:/app/data:ro

    depends_on:
      qdrant:
        condition: service_healthy
      bootstrap:
        condition: service_healthy

    healthcheck:
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/127.0.0.1/5555" || exit 1']
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 60s

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    image: qdrant/qdrant:v1.15.0
    restart: unless-stopped

    expose:
      - '6333'
      - '6334'

    volumes:
      - wrenai_data:/qdrant/storage

    healthcheck:
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/127.0.0.1/6333" || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  wren-ui:
    image: ghcr.io/canner/wren-ui:0.32.3
    restart: unless-stopped

    ports:
      - '${SERVICE_PORT_WREN_AI:-3000}:3000'

    environment:
      - SERVICE_URL_WREN_AI_3000
      - DB_TYPE=sqlite
      - SQLITE_FILE=/app/data/db.sqlite3
      - WREN_ENGINE_ENDPOINT=http://wren-engine:8080
      - WREN_AI_ENDPOINT=http://wren-ai-service:5555
      - IBIS_SERVER_ENDPOINT=http://ibis-server:8000
      - GENERATION_MODEL=${GENERATION_MODEL:-gpt-4o-mini}
      - WREN_ENGINE_PORT=8080
      - WREN_AI_SERVICE_VERSION=0.29.3
      - WREN_UI_VERSION=0.32.3
      - WREN_ENGINE_VERSION=0.22.0
      - WREN_PRODUCT_VERSION=0.29.2
      - TZ=${TZ:-UTC}

    volumes:
      - wrenai_data:/app/data

    depends_on:
      wren-ai-service:
        condition: service_healthy
      wren-engine:
        condition: service_healthy

    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://127.0.0.1:3000 || exit 1']
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  wrenai_data:
  wrenai_config:
