# documentation: https://github.com/gitleaks/gitleaks#docker
# shortDescription: Secret scanner for Git repositories and source files
# longDescription: <p>Gitleaks detects <strong>hardcoded secrets</strong> such as API keys, tokens, and passwords in repos and directories.</p><p>Mount sources under <code>/scan</code> (browse on port 8080) and run <code>docker compose exec --entrypoint gitleaks gitleaks detect --source=/scan</code>.</p>
# category: security,development,devops
# tags: gitleaks,secrets,security,sast,git,scanner
# port: 8080

services:
  gitleaks:
    image: ${GITLEAKS_IMAGE:-ghcr.io/gitleaks/gitleaks:latest}
    restart: ${GITLEAKS_RESTART_POLICY:-unless-stopped}

    entrypoint: ["/bin/bash", "-lc"]
    command: ["exec sleep infinity"]

    working_dir: /scan

    environment:
      - TZ=${TZ:-UTC}

    volumes:
      - gitleaks_scan:/scan

    healthcheck:
      test: ['CMD', 'gitleaks', 'version']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  gitleaks-web:
    image: ${GITLEAKS_WEB_IMAGE:-nginx:alpine}
    restart: ${GITLEAKS_RESTART_POLICY:-unless-stopped}

    ports:
      - '${SERVICE_PORT_GITLEAKS:-8080}:80'

    environment:
      - SERVICE_URL_GITLEAKS_8080
      - TZ=${TZ:-UTC}

    volumes:
      - gitleaks_scan:/usr/share/nginx/html:ro

    command:
      - /bin/sh
      - -c
      - |
        printf '%s\n' \
          'server {' \
          '  listen 80;' \
          '  root /usr/share/nginx/html;' \
          '  autoindex on;' \
          '}' > /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'

    depends_on:
      gitleaks:
        condition: service_healthy

    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/ || exit 1']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gitleaks_scan:
