version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: control-panel-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-templates}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - control-panel-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  control-panel-app:
    image: control-panel:latest
    build:
      context: ../..
      dockerfile: apps/control-panel-app/Dockerfile
      args:
        NODE_VERSION: "24.15.0"
    container_name: control-panel-app
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DOCKER_ENV: "true"
      PORT: ${PORT:-3000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-templates}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - control-panel-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  control-panel-network:
    driver: bridge
