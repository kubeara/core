<div style="margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2937;line-height:1.5;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:640px;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;background-color:#ffffff;">
    <tr>
      <td style="padding:24px 24px 20px;border-bottom:3px solid #2563eb;background-color:#ffffff;">
        <img src="{{logoDataUri}}" alt="{{brandName}}" width="140" height="auto" style="display:block;max-width:140px;height:auto;border:0;" />
        <p style="margin:14px 0 0;font-size:15px;font-weight:600;color:#2563eb;">{{headerSubtitle}}</p>
      </td>
    </tr>
    <tr>
      <td style="padding:24px;">
        <p style="margin:0 0 12px;font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#6b7280;">Details</p>
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;">
          {{detailsRows}}
        </table>

        <p style="margin:24px 0 12px;font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#6b7280;">{{contentLabel}}</p>
        <div style="padding:16px;background-color:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;color:#111827;white-space:pre-wrap;word-break:break-word;">{{content}}</div>
      </td>
    </tr>
    <tr>
      <td style="padding:14px 24px;background-color:#f9fafb;border-top:1px solid #e5e7eb;">
        <p style="margin:0;font-size:12px;color:#9ca3af;">Submitted via {{brandName}} website · {{submittedAt}} UTC</p>
      </td>
    </tr>
  </table>
</div>
