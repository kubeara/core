version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: template-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: templates
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - template-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: template-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - template-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  control-panel-app:
    build:
      context: .
      dockerfile: apps/control-panel-app/Dockerfile
      args:
        NODE_VERSION: "24.15.0"
    container_name: control-panel-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: templates
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - template-network
    restart: unless-stopped

  agent-app:
    build:
      context: .
      dockerfile: apps/agent-app/Dockerfile
      args:
        NODE_VERSION: "24.15.0"
    container_name: agent-app
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      CONTROL_PANEL_URL: http://control-panel-app:3000
    depends_on:
      - control-panel-app
    networks:
      - template-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  template-network:
    driver: bridge
