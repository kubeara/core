<!doctype html>
<html lang="en" class="h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Deploy infrastructure templates with Kubeara"
    />
    <link rel="icon" href="../console-app/assets/Logo_favicon.webp" />
    <title>Kubeara</title>
    <script>
      (function () {
        try {
          var preference = localStorage.getItem("kubeara-theme");
          var resolved = preference;
          if (preference !== "light" && preference !== "dark") {
            resolved = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.setAttribute("data-theme", resolved);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-full flex flex-col">
    <div id="root" class="min-h-full flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
