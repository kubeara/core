<!doctype html>
<html lang="en" class="h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Deploy infrastructure templates with Kubeara"
    />
    <link rel="icon" href="../console-app/assets/Logo_favicon.webp" />
    <title>Kubeara</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("kubeara-theme");
          if (t !== "light" && t !== "dark") {
            t = "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-full flex flex-col">
    <div id="root" class="min-h-full flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
